name: Build and Push Docker Image

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'development'
        type: choice
        options:
          - development

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/set-up-go@v7
        with:
          go-version: '1.27.1'

      - name: Build openbao
        run: make build 

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: bao
          path: ./bin/bao
          retention-days: 17
